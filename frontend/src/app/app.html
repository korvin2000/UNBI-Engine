<app-editor-toolbar />

<div class="workspace">
  <aside class="workspace__panel">
    <app-node-palette />
  </aside>

  <main class="workspace__canvas">
    <app-flow-canvas />
  </main>

  <!--
    The inspector sits after the canvas so that docking it is a flex column the canvas gives way
    to, and floating it is an absolute card over the canvas rather than under it. Mounted here
    rather than inside the canvas for the same reason the dialogs are: inside `f-flow` it would
    live in the transformed, clipped layer and be scaled by the zoom.
  -->
  <app-node-inspector />
</div>

<!--
  One instance, mounted at the shell. A picker opened from inside a node would live in the canvas's
  transformed, clipped layer — where a modal cannot cover the screen and would be scaled by the
  zoom — so the widgets ask a service and the dialog renders here.
-->
<app-file-browser />
<app-preset-dialog />
<app-profile-dialog />
<app-text-editor />
<app-settings-dialog />
<app-workflow-library />
