<div class="brand">
  <span class="brand__mark"><app-icon name="link" [size]="18" /></span>
  <span class="brand__name">UNBI</span>
  <span class="brand__chip">Prototype</span>
  <span class="brand__chip brand__chip--version">v0.1.0</span>
</div>

<div class="transport">
  <button
    class="transport__button transport__button--run"
    type="button"
    [disabled]="!canRun()"
    [attr.title]="runTooltip()"
    [attr.aria-label]="runTooltip()"
    (click)="run()"
  >
    <app-icon name="play" [size]="17" [filled]="true" [weight]="0" />
  </button>

  <button
    class="transport__button"
    type="button"
    [disabled]="!isRunning()"
    title="Stop the run"
    aria-label="Stop the run"
    (click)="stop()"
  >
    <app-icon name="stop" [size]="15" [filled]="true" [weight]="0" />
  </button>
</div>

<!--
  The status pill doubles as the progress bar and, when the graph will not run, as the way into the
  list of reasons. A disabled Run button with no route to "why" is the most common way an editor
  strands someone.
-->
<div class="status-wrap">
  <button
    class="status"
    type="button"
    [attr.data-kind]="statusKind()"
    [class.is-actionable]="problems().length > 0"
    [attr.aria-expanded]="problemsOpen()"
    [attr.title]="problems().length > 0 ? 'Show what is stopping the run' : statusText()"
    (click)="toggleProblems()"
  >
    <span class="status__bar" [style.width.%]="progressPercent()"></span>
    <span class="status__text">{{ statusText() }}</span>
    @if (problems().length > 0) {
      <app-icon class="status__more" name="chevron" [size]="12" />
    }
  </button>

  @if (problemsOpen() && problems().length > 0) {
    <div class="problems-backdrop" (pointerdown)="closeProblems()"></div>
    <ul class="problems" role="list">
      @for (problem of problems(); track $index) {
        <li>
          <app-icon name="warning" [size]="12" />
          <span>{{ problem.message }}</span>
        </li>
      }
    </ul>
  }
</div>

<div class="actions">
  <button type="button" [disabled]="!canUndo()" [attr.title]="undoTooltip()" aria-label="Undo" (click)="undo()">
    <app-icon name="undo" [size]="15" />
  </button>
  <button type="button" [disabled]="!canRedo()" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" (click)="redo()">
    <app-icon name="redo" [size]="15" />
  </button>

  <span class="actions__divider"></span>

  <!-- The settings panel. A toggle rather than an opener: it is the only way back once it has been
       closed, and `aria-pressed` is what says which of the two a press will do. Disabled with
       nothing to show, because the panel draws a node or draws nothing — a button that lit up over
       an empty screen would announce a panel nobody could see. -->
  <button
    type="button"
    [disabled]="!inspectorOpen() && !inspectorCanOpen()"
    [class.is-on]="inspectorOpen()"
    [attr.aria-pressed]="inspectorOpen()"
    [attr.title]="
      inspectorOpen()
        ? 'Hide the node settings panel'
        : inspectorCanOpen()
          ? 'Show the node settings panel'
          : 'Select a node to edit its settings'
    "
    aria-label="Node settings panel"
    (click)="toggleInspector()"
  >
    <app-icon name="sliders" [size]="15" />
  </button>

  <span class="actions__divider"></span>

  <button type="button" title="Load the example workflow" aria-label="Load the example workflow" (click)="loadExample()">
    <app-icon name="star" [size]="15" />
  </button>
  <button type="button" title="Open a workflow file" aria-label="Open a workflow file" (click)="open()">
    <app-icon name="open" [size]="15" />
  </button>
  <button type="button" title="Save this workflow" aria-label="Save this workflow" (click)="save()">
    <app-icon name="save" [size]="15" />
  </button>
  <button
    type="button"
    [disabled]="nodeCount() === 0"
    title="Clear the canvas"
    aria-label="Clear the canvas"
    (click)="clear()"
  >
    <app-icon name="trash" [size]="15" />
  </button>

  <span class="actions__divider"></span>

  <span
    class="link"
    [class.is-live]="connection() === 'open'"
    [attr.title]="connection() === 'open' ? 'Connected to the engine' : 'The editor cannot reach the engine — Run is unavailable until it reconnects'"
  >
    <span class="link__dot"></span>
    {{ connection() === 'open' ? 'Connected' : connection() === 'connecting' ? 'Connecting' : 'Offline' }}
  </span>
</div>
